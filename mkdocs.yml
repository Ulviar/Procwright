site_name: Procwright
site_description: Run external programs from Java and Kotlin with output handling, timeouts, and process cleanup.
site_url: https://ulviar.github.io/Procwright/
repo_name: Ulviar/Procwright
repo_url: https://github.com/Ulviar/Procwright
edit_uri: edit/main/docs/
docs_dir: !ENV [PROCWRIGHT_DOCS_DIR, docs]
site_dir: build/public-docs
strict: true
exclude_docs: |
  requirements.txt
  requirements.lock

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - docs
      check_paths: true
      restrict_base_path: true
      url_download: false
  - pymdownx.superfences

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Add to your application: release/installation.md
  - Examples: examples.md
  - How-to:
      - how-to/index.md
      - Choose a scenario: how-to/choose-process-scenario.md
      - Run a command: how-to/run-finite-command.md
      - Stop a hung command: how-to/stop-hung-processes.md
      - Follow live output: how-to/follow-logs.md
      - Talk to a line worker: how-to/talk-to-line-worker.md
      - Automate prompts: how-to/automate-prompts.md
      - Require a terminal: how-to/require-terminal.md
      - Wrap a CLI as a service: how-to/wrap-cli-tool.md
      - Pool concurrent requests: how-to/reuse-workers.md
  - Reference:
      - reference/index.md
      - Scenarios:
          - scenarios/index.md
          - Run: scenarios/run.md
          - Interactive sessions: scenarios/interactive.md
          - Expect: scenarios/expect.md
          - Line sessions: scenarios/line-session.md
          - Protocol sessions: scenarios/protocol-session.md
          - Streaming: scenarios/streaming.md
          - Pooling: scenarios/pooling.md
          - Terminal support: scenarios/terminal.md
          - Integrations: scenarios/integrations.md
      - Commands and environment: reference/command-model.md
      - Settings and lifecycle: reference/policies.md
      - Defaults: reference/defaults.md
      - Output ownership: reference/output-ownership.md
      - Results and errors: reference/results-and-errors.md
      - Timeout and close guarantees: explanations/process-cleanup-limits.md
      - Diagnostics: reference/diagnostics.md
      - Security: reference/security.md
      - Platforms and terminals: reference/platforms-and-pty.md
      - Kotlin API: reference/kotlin-api.md
      - Generated API docs:
          - api/index.md
          - Core Java API: api/java/core/index.html
          - Integrations Java API: api/java/integrations/index.html
  - Setup and compatibility:
      - release/index.md
      - Compatibility: release/compatibility.md
      - Known limitations: release/known-limitations.md
