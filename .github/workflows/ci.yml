name: CI

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify Java 25 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            verification: regressionCheck spotlessCheck publicationStructureCheck :procwright-kotlin:kotlinJSpecifyStrictnessCheck
          - os: macos-latest
            verification: scenarioCheck
          - os: windows-2025
            verification: scenarioCheck

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25.0.4.1+1"

      # Provides build caching and validates Gradle wrapper jars automatically.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify system PTY prerequisites
        if: runner.os != 'Windows'
        run: command -v script && command -v stty && command -v env && command -v dd

      - name: Verify Unix
        if: runner.os != 'Windows'
        run: ./gradlew ${{ matrix.verification }} --no-daemon
        env:
          ORG_GRADLE_PROJECT_procwright.requireSystemPty: ${{ runner.os != 'Windows' }}

      - name: Verify Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat ${{ matrix.verification }} --no-daemon

      - name: Publication smoke Unix
        if: matrix.os == 'ubuntu-24.04'
        run: |
          set -euo pipefail
          repository="${RUNNER_TEMP}/procwright-m2"
          ./gradlew publishToMavenLocal \
            -Dmaven.repo.local="${repository}" \
            --project-prop=procwright.version=0.1.0 \
            --no-daemon
          ./gradlew \
            :procwright-consumer-examples:test \
            :procwright-integrations-consumer-example:check \
            :procwright-kotlin-consumer-example:check \
            --project-prop=procwright.consumerVersion=0.1.0 \
            --project-prop=procwright.consumerRepository="${repository}" \
            --dependency-verification=off \
            --refresh-dependencies \
            --rerun-tasks \
            --no-daemon
          ./gradlew \
            :procwright-consumer-examples:test \
            :procwright-integrations-consumer-example:check \
            :procwright-kotlin-consumer-example:check \
            --project-prop=procwright.consumerVersion=0.1.0 \
            --project-prop=procwright.consumerRepository="${repository}" \
            --project-prop=procwright.consumerPomOnly=true \
            --dependency-verification=off \
            --refresh-dependencies \
            --rerun-tasks \
            --no-daemon

      - name: Upload failed test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failed-tests-${{ matrix.os }}-java-25
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25.0.4.1+1"

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build docs site in strict mode
        run: ./gradlew publicDocsCheck --no-daemon

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/public-docs

  deploy-docs:
    name: Deploy documentation
    needs:
      - verify
      - docs
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
